# Docker Compose for Railway Intelligence Platform
# TODO: Full containerization is future scope.
# This file provides a reference for service orchestration.

version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: railway-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: railway-mqtt
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  mongodb_data:
  mosquitto_data:
  mosquitto_log:
